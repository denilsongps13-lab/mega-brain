name: Windows Gemini launcher
on:
  push:
    branches: [fix/windows-gemini-launcher]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  launcher:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r windows/requirements-test.txt
      - name: Check committed installer against sources
        run: python scripts/validate_windows_release.py
      - name: Native launcher, real LiteLLM and synthetic upstream tests
        run: python -m pytest tests/ -v --tb=short
      - run: node --check .claude/hooks/run-hook.cjs
      - run: node --check mega-brain-core/core/synapse/runtime/hook-runtime.js
      - run: node --check mega-brain-core/hooks/unified/runners/precompact-runner.js
      - name: Build final installer
        run: python scripts/build_windows_installer.py
      - name: Verify reproducibility
        run: git diff --exit-code -- windows/INSTALAR_MEGA_CEREBRO_FINAL.zip
      - name: Upload final installer
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: INSTALAR_MEGA_CEREBRO_FINAL
          path: windows/INSTALAR_MEGA_CEREBRO_FINAL.zip
          if-no-files-found: error
