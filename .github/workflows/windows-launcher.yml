name: Windows Gemini launcher
on:
  pull_request:
    paths:
      - 'scripts/start_mega_brain.py'
      - 'scripts/build_windows_installer.py'
      - '.claude/hooks/run-hook.cjs'
      - 'tests/test_windows_launcher.py'
      - '.github/workflows/windows-launcher.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  launcher:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install python-dotenv PyYAML
      - run: python -m unittest discover -s tests -p test_windows_launcher.py -v
      - run: node --check .claude/hooks/run-hook.cjs
