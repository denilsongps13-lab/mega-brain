name: Testar Gemini Mega Brain

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar-gemini:
    name: Testar conexão Gemini
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Verificar se a chave existe
        shell: bash
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY não encontrada nos GitHub Secrets."
            exit 1
          fi
          echo "OK: GEMINI_API_KEY encontrada (valor protegido)."

      - name: Testar API Gemini
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          key = os.environ["GEMINI_API_KEY"]
          model = "gemini-2.5-flash"
          url = (
              "https://generativelanguage.googleapis.com/v1beta/models/"
              + model + ":generateContent?key=" + key
          )
          body = json.dumps({
              "contents": [{
                  "parts": [{
                      "text": "Responda somente: MEGA BRAIN GEMINI OK"
                  }]
              }]
          }).encode()

          req = urllib.request.Request(
              url,
              data=body,
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = json.load(r)
              text = data["candidates"][0]["content"]["parts"][0]["text"].strip()
              print("Resposta do Gemini:", text)
              print("OK: conexão real com Gemini funcionando.")
          except urllib.error.HTTPError as e:
              raw = e.read().decode("utf-8", "replace")
              try:
                  obj = json.loads(raw)
                  msg = obj.get("error", {}).get("message", raw)
              except Exception:
                  msg = raw
              print(f"ERRO HTTP {e.code}: {msg}")
              raise SystemExit(1)
          except Exception as e:
              print("ERRO:", type(e).__name__, str(e))
              raise SystemExit(1)
          PY
