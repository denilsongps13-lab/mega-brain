name: Test
on:
  push:
    branches: [main, fix/windows-gemini-launcher]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r windows/requirements-test.txt
      - run: python scripts/build_windows_installer.py
      - run: python -m pytest tests/ -v --tb=short --cov=scripts --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
  secrets-scan:
    runs-on: ubuntu-latest
    # gitleaks-action Post-step posts a PR summary comment; without write
    # access it crashed "Resource not accessible by integration". gitleaks
    # itself already passed (0 leaks). Grant minimal perms for the comment.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
