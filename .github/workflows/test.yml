name: Test

on:
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main, feat/ruflo-best-of]
    paths:
      - 'engine/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install pytest pytest-cov
      - name: Run Python tests
        run: python3 -m pytest tests/python/ -v --tb=short
      - name: Verify V7 commercial coverage
        run: |
          python3 -m pytest tests/python/test_commercial_v7.py tests/python/test_bravopay_v7.py -v --tb=short \
            --cov=engine/commercial \
            --cov-report=term-missing \
            --cov-fail-under=70
      - name: Run E2E BrainEngine tests when available
        run: |
          if [ -d tests/e2e ]; then
            python3 -m pytest tests/e2e/ -v --tb=short
          else
            echo "tests/e2e not present on this branch; Python executor E2E coverage already runs under tests/python/test_executor_e2e.py"
          fi
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: .coverage
          retention-days: 7
  secrets-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
