name: Validate

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: pip install pyyaml
      - name: JSON integrity
        run: |
          python3 - <<'PY'
          import json, pathlib
          errors=[]; count=0
          for f in pathlib.Path('.').rglob('*.json'):
              if any(p in {'.git','node_modules','.data'} for p in f.parts):
                  continue
              count += 1
              try: json.loads(f.read_text(encoding='utf-8'))
              except Exception as e: errors.append(f'{f}: {e}')
          if errors:
              raise SystemExit('\n'.join(errors))
          print(f'Validated {count} JSON files')
          PY
      - name: YAML integrity
        run: |
          python3 - <<'PY'
          import pathlib, yaml
          errors=[]; count=0
          skip={'.git','node_modules','.data','.venv','venv','__pycache__'}
          for pattern in ('*.yaml','*.yml'):
              for f in pathlib.Path('.').rglob(pattern):
                  if any(p in skip for p in f.parts):
                      continue
                  count += 1
                  try: yaml.safe_load(f.read_text(encoding='utf-8'))
                  except Exception as e: errors.append(f'{f}: {e}')
          if errors:
              raise SystemExit('\n'.join(errors))
          print(f'Validated {count} YAML files')
          PY
