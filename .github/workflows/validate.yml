name: Validate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Runtime validation
        run: npm run validate

      - name: JSON integrity
        run: |
          python -c "
          import json, pathlib
          errors = []
          skip = {'.git', 'node_modules'}
          count = 0
          for f in pathlib.Path('.').rglob('*.json'):
              if any(part in skip for part in f.parts):
                  continue
              count += 1
              try:
                  json.loads(f.read_text(encoding='utf-8'))
              except Exception as e:
                  errors.append(f'{f}: {e}')
                  print(f'::error file={f}::{e}')
          if errors:
              raise SystemExit(f'{len(errors)} invalid JSON files out of {count}')
          print(f'Validated {count} JSON files')
          "

      - name: YAML integrity
        run: |
          python -c "
          import pathlib, yaml
          errors = []
          skip_dirs = {'.git','node_modules','.data','logs','processing','artifacts','.venv','venv','__pycache__','trash','worktrees'}
          for pattern in ('*.yaml','*.yml'):
              for f in pathlib.Path('.').rglob(pattern):
                  if any(part in skip_dirs for part in f.parts):
                      continue
                  p = f.as_posix()
                  if '/templates/' in ('/'+p) or p.startswith('agents/') or p.startswith('knowledge/'):
                      continue
                  try:
                      yaml.safe_load(f.read_text(encoding='utf-8'))
                  except Exception as e:
                      errors.append(f'{p}: {e}')
                      print(f'::error file={p}::{e}')
          if errors:
              raise SystemExit(f'{len(errors)} invalid runtime YAML files')
          print('Runtime YAML integrity OK')
          "
